version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: farmcity-postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keystone-cms:
    build: .
    container_name: farmcity-cms
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./keystone-data:/app/keystone-data

volumes:
  postgres-data:
