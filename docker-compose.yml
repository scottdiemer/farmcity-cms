services:
  postgres:
    image: postgres:15

    container_name: farmcity-postgres

    restart: always

    ports:
      - "127.0.0.1:5432:5432"

    env_file:
      - .env.docker

    volumes:
      - postgres-data:/var/lib/postgresql/data

  keystone-cms:
    build: .

    container_name: farmcity-cms

    restart: always

    ports:
      - "5000:5000"

    env_file:
      - .env.docker

    depends_on:
      - postgres

    volumes:
      # Persist uploaded images outside of the container.
      - ./public/images:/app/public/images

volumes:
  postgres-data:
